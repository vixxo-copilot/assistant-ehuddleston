table:
  name: AEOPageStatus
  sheet: AEO Page Status
  urlColumns:
    before: C  # Before URL — published live page (hyperlink)
    after: D   # After URL — HubSpot editor link to clone draft (not www.vixxo.com)

# Before URL (C) = published live page on www.vixxo.com.
# After URL (D) = HubSpot editor URL for the clone draft (open → Preview in editor).
# Draft slugs are NOT live until publish; do not use page.url in column D.
# Both URL columns use Excel hyperlinks for one-click comparison.
# SEO meta fields are staged on the clone draft only (never auto-publish to live).
columns:
